# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

general:
  branches:
    ignore:
      - gh-pages

orbs:
  browser-tools: circleci/browser-tools@1.2.4

defaults: &defaults
  docker:
    - image: cimg/node:22.2.0-browsers
      environment:
        CHROME_BIN: /usr/bin/google-chrome


jobs:
  prep:
    <<: *defaults
    steps:
      - checkout
      - run: npm ci
      - run:
          name: "version"
          command: |
            sh ./version.sh ${CIRCLE_BUILD_NUM} ${CIRCLE_BRANCH}
            cat foo.txt
      - persist_to_workspace:
          root: .
          paths:
            - .
  test:
    <<: *defaults
    steps:
      - attach_workspace:
          at: .
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - run: npm run test:ci
  build:
    <<: *defaults
    steps:
      - attach_workspace:
          at: .
      - run: npm ci
      - run: npm run build
      - store_artifacts:
          path: /dist/muziehdesign/forms
          destination: forms
      - persist_to_workspace:
          root: .
          paths:
            - dist
  publish:
    <<: *defaults
    steps:
      - attach_workspace:
          at: .
      - run:
          name: 'npm publish prep'
          command: |
            touch .npmrc
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
      - run: 
          name: 'npm publish'
          command: |
            if  [ "${CIRCLE_BRANCH}" = "develop" ]; then
              echo "publishing next package"
              npm publish ./dist/muziehdesign/forms --tag next
            elif (echo "$BRANCH" | grep -q "^release/"); then
              echo "publishing release package"
              npm publish ./dist/muziehdesign/forms
            else
              echo "publishing beta package"
              npm publish ./dist/muziehdesign/forms --tag beta
            fi

workflows:
  publish:
    jobs:
      - prep
      - test
          requires:
            - prep
      - build
          requires:
            - prep
      - publish:
          context: SharedContext
          requires:
            - test
            - build
