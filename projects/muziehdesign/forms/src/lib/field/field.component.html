<label class="field">
    @if(label && controlType !== 'checkbox') {
        <span class="field-label">
            {{ label }} 
        </span>
    }
    <ng-content></ng-content>

    @if(controlType === 'checkbox' && label) {
    <span class="checkbox-label">{{ label }}</span>
    } 
    @if(ngModel?.touched && ngModel?.invalid) {
    <div class="field-error">
        {{ getErrorMessage() }}
    </div>
    }
</label>
